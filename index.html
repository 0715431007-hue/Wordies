<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordie - Strategic Word Puzzle Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Wordie</h1>
        <div class="nav-buttons">
            <button class="mini-games-btn">Mini Games</button>
        </div>
    </header>

    <main class="game-container">
        <div class="hints-panel">
            <h3>Hints</h3>
            <div class="hints-box">
                <div class="hint-item">
                    <button id="vowelHint" onclick="showPopup()">Vowel</button>
                </div>
                <div class="hint-item">
                    <button id="letterHint" onclick="showPopup()">Letter</button>
                </div>
                <div class="hint-item">
                    <button id="consonantHint" onclick="showPopup()">Consonant</button>
            </div>
            </div>
            <div class="hints-count">Hints Available: 3</div>
        </div>

        <div class="game-board">
            <div class="word-grid">
                <div class="word-row">
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                </div>
                <div class="word-row">
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                </div>
                <div class="word-row">
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                </div>
                <div class="word-row">
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                </div>
                <div class="word-row">
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                </div>
                <div class="word-row">
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                    <div class="letter-box"></div>
                </div>
            </div>

            <div class="keyboard">
                <div class="keyboard-row">
                    <button class="key"></button>
                    <button class="key available"></button>
                    <button class="key"></button>
                    <button class="key wrong-position">R</button>
                    <button class="key"></button>
                    <button class="key"></button>
                    <button class="key"></button>
                    <button class="key available"></button>
                    <button class="key correct-position"></button>
                    <button class="key">P</button>
                </div>
                <div class="keyboard-row">
                    <button class="key available">A</button>
                    <button class="key correct-position">S</button>
                    <button class="key correct-position">D</button>
                    <button class="key">F</button>
                    <button class="key">G</button>
                    <button class="key">H</button>
                    <button class="key">J</button>
                    <button class="key">K</button>
                    <button class="key wrong-position">L</button>
                </div>
                <div class="keyboard-row">
                    <button class="key special">ENTER</button>
                    <button class="key">Z</button>
                    <button class="key">X</button>
                    <button class="key">C</button>
                    <button class="key">V</button>
                    <button class="key">B</button>
                    <button class="key">N</button>
                    <button class="key">M</button>
                    <button class="key special">⌫</button>
                </div>
            </div>
        </div>
        <div id="popup" class="popup">
            <div class="popup-content">
                <span class="close-btn" id="closeBtn">&times;</span>
                <h3>Minigame</h3>
                <div id="minigameArea">
                    <p>Your minigame will appear here!</p>
                </div>
            </div>
        </div>
    </main>
    <script src="myscript.js"></script>
</body>
</html>
