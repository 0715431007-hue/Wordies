<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordie - Strategic Word Puzzle Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Wordie</h1>
        <div class="nav-buttons">
            <button class="mini-games-btn">Mini Games</button>
        </div>
    </header>

    <main class="game-container">
        <div class="hints-panel">
            <h3>Hints</h3>
            <div class="hints-box">
                <div class="hint-item">
                    <button id="vowelHint" onclick="showVowelGame()">Vowel</button>
                </div>
                <div class="hint-item">
                    <button id="letterHint" onclick="showLetterGame()">Letter</button>
                </div>
                <div class="hint-item">
                    <button id="consonantHint" onclick="showConsonantGame()">Consonant</button>
            </div>
            </div>
            <div class="hints-count">Hints Available: 3</div>
            <div id="gameBoard">
    <!-- 6 rows of 5 letter boxes each -->
        <div class="guess-row">
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
     </div>
        <div class="guess-row">
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
    </div>
        <div class="guess-row">
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
    </div>
    <div class="guess-row">
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
    </div>
    <div class="guess-row">
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
    </div>
    <div class="guess-row">
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
    </div>
</div>

<!-- Keyboard -->
<div id="keyboard">
    <div class="keyboard-row">
        <button class="key-btn">Q</button>
        <button class="key-btn">W</button>
        <button class="key-btn">E</button>
        <button class="key-btn">R</button>
        <button class="key-btn">T</button>
        <button class="key-btn">Y</button>
        <button class="key-btn">U</button>
        <button class="key-btn">I</button>
        <button class="key-btn">O</button>
        <button class="key-btn">P</button>
    </div>
    <div class="keyboard-row">
        <button class="key-btn">A</button>
        <button class="key-btn">S</button>
        <button class="key-btn">D</button>
        <button class="key-btn">F</button>
        <button class="key-btn">G</button>
        <button class="key-btn">H</button>
        <button class="key-btn">J</button>
        <button class="key-btn">K</button>
        <button class="key-btn">L</button>
    </div>
    <div class="keyboard-row">
        <button class="key-btn">Z</button>
        <button class="key-btn">X</button>
        <button class="key-btn">C</button>
        <button class="key-btn">V</button>
        <button class="key-btn">B</button>
        <button class="key-btn">N</button>
        <button class="key-btn">M</button>
        <button class="key-btn" id="enterBtn">ENTER</button>
        <button class="key-btn" id="deleteBtn">DEL</button>
    </div>
</div>


        <div id="popup" class="popup">
            <div class="popup-content">
                <span class="close-btn" id="closeBtn">&times;</span>
                <h3>Minigame</h3>
                <div id="minigameArea">
                    <p>Your minigame will appear here!</p>
                </div>
            </div>
        </div>
    </main>
    <script src="myscript.js"></script>
</body>
</html>
